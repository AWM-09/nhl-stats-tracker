name: Validate and deploy NHL analytics platform

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required platform files
        run: |
          set -euo pipefail
          for file in index.html tracker.html player.html teams.html team.html h2h.html teams.js team.js h2h.js research.html calendar.html news.html records.html health.html predictions.html rulebook.html accuracy.html search.html video-studio.html video-studio.js recommendation.js nhl.css nhl.js favicon.svg; do
            test -s "$file" || { echo "Missing required platform file: $file"; exit 1; }
          done
          grep -qi 'NHL' index.html
          grep -q 'NHL Stats' tracker.html
          for file in nhl.js teams.js team.js h2h.js video-studio.js recommendation.js; do node --check "$file"; done

      - name: Validate inline JavaScript in dashboard pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          pages = [
              "index.html", "tracker.html", "player.html", "teams.html", "team.html", "h2h.html",
              "research.html", "calendar.html",
              "news.html", "records.html", "health.html", "predictions.html", "rulebook.html", "accuracy.html", "search.html", "video-studio.html"
          ]
          for page in pages:
              source = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", source, re.I)
              for number, script in enumerate(scripts, start=1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as handle:
                      handle.write(script)
                      handle.flush()
                      result = subprocess.run(["node", "--check", handle.name], capture_output=True, text=True)
                  if result.returncode:
                      print(f"JavaScript syntax error in {page}, inline script {number}")
                      print(result.stderr)
                      raise SystemExit(result.returncode)
          print("All inline JavaScript syntax checks passed.")
          PY

      - name: Prepare complete multi-page site
        run: |
          set -euo pipefail
          mkdir -p site
          python3 scripts/build_nhl_cache.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          weeks = sorted(Path("site/data/schedule").glob("week-*.json"))
          if len(weeks) < 40:
              raise SystemExit(f"Calendar cache incomplete: only {len(weeks)} weekly snapshots")
          for path in weeks:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("cache_error") or not isinstance(payload.get("gameWeek", payload.get("games")), list):
                  raise SystemExit(f"Invalid weekly schedule cache: {path}")
          print(f"Validated {len(weeks)} full-season calendar weeks.")
          PY
          cp index.html tracker.html player.html teams.html team.html h2h.html research.html calendar.html news.html records.html health.html predictions.html rulebook.html accuracy.html search.html video-studio.html video-studio.js recommendation.js nhl.css nhl.js teams.js team.js h2h.js favicon.svg site/
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          teams = "ANA UTA BOS BUF CGY CAR CHI COL CBJ DAL DET EDM FLA LAK MIN MTL NSH NJD NYI NYR OTT PHI PIT SEA SJS STL TBL TOR VAN VGK WPG WSH".split()
          today = datetime.now(timezone.utc)
          season_start = today.year if today.month >= 8 else today.year - 1
          root = Path("site/data/teams")
          errors = []
          for code in teams:
              for suffix in ("roster", f"schedule-{season_start-1}", f"schedule-{season_start}"):
                  path = root / f"{code}-{suffix}.json"
                  if not path.is_file():
                      raise SystemExit(f"Missing team cache: {path}")
                  try:
                      payload = json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      raise SystemExit(f"Invalid team cache {path}: {exc}")
                  if payload.get("cache_error"):
                      errors.append(str(path))
                  elif suffix.startswith("schedule-") and not isinstance(payload.get("games"), list):
                      raise SystemExit(f"Unexpected team schedule schema: {path}")
                  elif suffix == "roster" and not isinstance(payload, dict):
                      raise SystemExit(f"Unexpected team roster schema: {path}")
          print(f"Validated {len(teams)} team caches; {len(errors)} are unavailable from the upstream NHL API and will show as unavailable in the UI.")
          history_root = Path("site/data/team-history")
          for code in teams:
              history_path = history_root / f"{code}.json"
              if not history_path.is_file():
                  raise SystemExit(f"Missing team history cache: {history_path}")
              history = json.loads(history_path.read_text(encoding="utf-8"))
              if history.get("team") != code or not isinstance(history.get("seasons"), list) or not history["seasons"]:
                  raise SystemExit(f"Invalid or empty team history cache: {history_path}")
              if any(not isinstance(season.get("year"), int) for season in history["seasons"]):
                  raise SystemExit(f"Invalid season entry in team history cache: {history_path}")
          print(f"Validated full franchise history caches for {len(teams)} teams.")
          h2h_root = Path("site/data/h2h")
          pair_files = list(h2h_root.glob("*.json"))
          expected_pairs = len(teams) * (len(teams) - 1) // 2
          if len(pair_files) != expected_pairs:
              raise SystemExit(f"All-time H2H cache incomplete: expected {expected_pairs} pairs, found {len(pair_files)}")
          total_games = 0
          for path in pair_files:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Invalid all-time H2H data {path}: {exc}")
              games = payload.get("games")
              if not isinstance(games, list):
                  raise SystemExit(f"Unexpected all-time H2H schema: {path}")
              if any(not game.get("gameDate") or game.get("homeTeam", {}).get("score") is None or game.get("awayTeam", {}).get("score") is None for game in games):
                  raise SystemExit(f"Incomplete score/date in all-time H2H data: {path}")
              total_games += len(games)
          print(f"Validated {len(pair_files)} all-time H2H pair files with {total_games} completed games.")
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          games = sorted(Path("site/data/games/by-season").glob("*.json"))
          if not games:
              raise SystemExit("Historical game cache is empty.")
          for path in games:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload.get("games"), list):
                  raise SystemExit(f"Invalid historical game cache: {path}")
              if any(not game.get("gameDate") or game.get("homeScore") is None or game.get("awayScore") is None or game.get("home") == game.get("away") for game in payload["games"]):
                  raise SystemExit(f"Incomplete historical game data: {path}")
          print(f"Validated {len(games)} season game caches.")
          PY
          if [ -d data ]; then cp -R data site/data; fi
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"generated_at":"%s","commit":"%s","run_id":"%s"}\n' "$GENERATED_AT" "$GITHUB_SHA" "$GITHUB_RUN_ID" > site/build-info.json
          test -s site/index.html
          test -s site/tracker.html
          test -s site/nhl.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Keep the standard artifact name. GitHub Pages deployment discovers
      # the Pages artifact through its deployment API; a custom name can make
      # a successfully uploaded Actions artifact invisible to that API.
      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        uses: actions/deploy-pages@v4
